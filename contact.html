</head>
<body>

 </a>

            >

            </button>

            <!-- Navigation Links -->
            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

        </div>

                                        <!-- header -->

<header class="page-header bg-primary ">

    <div class="container text-center">

        <p class="section-label pt-3">CONTACT</p>

        <h1>Get In Touch</h1>

        <p>Have a question? Send us a message.</p>

    </div>

</header>


                                                            <!-- form -->
    <div class="container mt-5">

    
        <form>

            <!-- Name -->
            <div class="mb-3">

                <label for="name"
                       class="form-label">
                    Full Name
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="name"
                    placeholder="Enter your name"
                    required>

            </div>


            <!-- Email -->
            <div class="mb-3">

                <label for="email"
                       class="form-label">
                    Email
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="Enter your email"
                    required>

            </div>



            <!-- products Dropdown -->
            <div class="mb-3">

                <label for="product"
                       class="form-label">
                    Product
                </label>

                <select
                    class="form-select"
                    id="product"
                    required>

                    <option value="">
                        Select your products
                    </option>

                    <option value="laptop">
                        laptop
                    </option>

                    <option value="smartphone">
                        smartphone
                    </option>

                    <option value="smartwatch">
                        smartwatch
                    </option>

                    <option value="headphone">
                        headphone
                    </option>

                    <option value="camera">
                        camera
                    </option>
  <option value="keyboard">
                        keyboard
                    </option>
                </select>

            </div>


            <!-- prefered contact -->
            <div class="mb-3">

                <label class="form-label">
                    Preferred contact
                </label>

                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="radio"
                        name="pre"
                        id="email"
                        value="email"
                        required>

                    <label
                        class="form-check-label"
                        for="email">

                        Email

                    </label>

                </div>


                <div class="form-check">

                    <input
                        class="form-check-input"
                        type="radio"
                        name="pre"
                        id="phone"
                        value="phone">

                    <label
                        class="form-check-label"
                        for="phone">

                        Phone

                    </label>

                </div>

            </div>
<!-- Mesaage -->

                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" rows="5"
                                  placeholder="Write your message..." required></textarea>
                        <div class="invalid-feedback">Please enter your message.</div>
                    </div>
            <!-- Checkbox -->
            <div class="mb-3 form-check">

                <input
                    type="checkbox"
                    class="form-check-input"
                    id="terms"
                    required>

                <label
                    class="form-check-label"
                    for="terms">

                    I agree to the terms and conditions

                </label>

            </div>


            <!-- Submit Button -->
            <button
                type="submit"
                class="btn btn-primary mb-2">

                Send Message

            </button>

        </form>

    </div>


<footer class="footer py-4 bg-dark text-white">
    <div class="container text-center">
        <span class="fw-bold"><span class="brand-blue">Tech</span>Store</span>
        <span class=" text-white"> — Technology for a better tomorrow.</span>
    </div>
</footer>




</body>
